name: CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black
          # Install requirements to verify import syntax checks
          pip install -r backend/requirements.txt --default-timeout=100 --prefer-binary

      - name: Run Black formatter check
        run: black --check backend/app

      - name: Run Flake8 linter
        run: flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest Test Suite
        run: |
          cd backend
          python -m pytest

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-python@v4 # note: setup-node is preferred for node, but let's use official setup-node
        
      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Validate TypeScript build
        run: |
          cd frontend
          npx tsc --noEmit
